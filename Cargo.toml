[package]
name = "xoros-rescue-shell"
version = "0.1.1-2"
edition = "2021"
rust-version = "1.95"
build = "build.rs"
homepage = "https://github.com/xoros-repo/xoros-rescue-shell"
repository = "https://github.com/xoros-repo/xoros-rescue-shell.git"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# UI only (src/ui/): cursive with the crossterm backend (UI-1, ARCH-1).
cursive = { version = "0.20", default-features = false, features = ["crossterm", "crossterm-backend"] }
cursive_buffered_backend = "0.6"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
libc = "0.2"
log = { version = "0.4", features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
tar = { version = "0.4", default-features = false }
flate2 = "1"

# Shared device/boot/OTA logic (CORE-1). Development form: a path dependency on a sibling
# checkout of xoros-xor-tool. Release form (CORE-1, XD-6; the Yocto recipe redirects it with a
# cargo [patch], so keep this exact URL):
# xoros-core = { git = "ssh://git@github.com/xoros-repo/xoros-xor-tool.git", rev = "<commit>" }
xoros-core = { path = "../xoros-xor-tool/xoros-core" }

[profile.release]
lto = true
opt-level = "s"
strip = true

[dev-dependencies]
tempfile = "3"
# Local HTTP server for the OTA integration tests (TEST-2); same version as xoros-core's.
tiny_http = "0.12"
